{{ define "main" }}
<article class="post">
  <header class="post-header">
    <div class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02.01.2006" }}</time>
      {{ range .Params.tags }}<a class="tag" href="{{ printf "tags/%s/" (urlize .) | relURL }}">{{ . }}</a>{{ end }}
    </div>
    <h1>{{ .Title }}</h1>
  </header>
  <div class="post-content">{{ .Content }}</div>
</article>
<a class="back-link" href="{{ site.Home.RelPermalink }}">&larr; all posts</a>
{{ end }}
